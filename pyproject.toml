[project]
name = "cordelia"
version = "0.1.0"
description = "cordelia live coding language"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
   "abjad>=3.31",
   "ctcsound>=6.17.1",
   "jinja2>=3.1.6",
   "lark>=1.3.1",
   "loguru>=0.7.3",
   "matplotlib>=3.11.0",
   "nltk>=3.9.4",
   "orjson>=3.11.9",
   "pydantic>=2.13.4",
   "rich>=15.0.0",
   "rmakers>=3.31",
   "scipy>=1.17.1",
]

[project.scripts]
cordelia = "cordelia.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
   "pytest>=8.0.0",
   "syrupy>=5.3.2",
]
